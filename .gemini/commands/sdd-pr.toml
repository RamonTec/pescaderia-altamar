4. Redacta el título (`tipo(ámbito): …`, igual al commit principal) y el cuerpo con `.github/pull_request_template.md`, con hechos del diff y no del spec copiado.
5. Haz push (`git push -u pescaderia-altamar <rama>`). Si `gh` está disponible, crea el PR hacia `main` con `gh pr create --base main --title … --body-file …`. Si no, entrega al usuario el título, el cuerpo y el enlace `https://github.com/RamonTec/pescaderia-altamar/compare/main...<rama>?expand=1`.
6. No hagas merge ni actives auto-merge.
"""
