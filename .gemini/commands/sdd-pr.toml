description = "Prepara y abre el PR de la rama actual de un módulo SDD, con mensaje según la plantilla del repo."
prompt = """
Prepara el PR del módulo `{{args}}` (si está vacío, dedúcelo de la rama actual y de los commits `Tareas: NN-…`).

Sigue "Flujo Git" en `AGENTS.md`:

1. Verifica que la rama actual no sea `main`, que el árbol esté limpio y que `npm run lint` y `npx tsc --noEmit` pasen. Si algo falla, detente y repórtalo.
